name: 일일 HR 뉴스레터 자동화

on:
  schedule:
    # 🌟 평일(월,화,수,목,금)에만 작동하도록 요일 제한(1-5) 설정
    # (외부 타이머 세팅이 번거로우실 경우를 대비한 최소한의 예약 안전장치입니다)
    - cron: '45 22 * * 1-5'
  workflow_dispatch: # 🚀 외부 타이머(cron-job.org)가 API로 즉시 원격 제어할 수 있는 문을 열어둡니다.

permissions:
  contents: write

jobs:
  run-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: pip install feedparser requests

      - name: 스크립트 실행
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Update last run log (keep repo active)
        run: |
          mkdir -p logs
          echo "Last run: $(date '+%Y-%m-%d %H:%M:%S %Z')" > logs/last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/last_run.txt
          git diff --staged --quiet || git commit -m "chore: update last run log [skip ci]"
          git push
